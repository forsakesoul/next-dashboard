<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日A股复盘系统 (JSON生成器)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f3f4f6; }
        .json-pre { background-color: #1e293b; color: #a5b4fc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-family: monospace; font-size: 0.875rem; }
        .key { color: #93c5fd; }
        .string { color: #86efac; }
        .number { color: #fca5a5; }
        .boolean { color: #fdba74; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 内置图标组件 (替换外部依赖，确保稳定性) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Activity = (props) => <IconWrapper {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></IconWrapper>;
        const BarChart3 = (props) => <IconWrapper {...props}><line x1="12" y1="20" x2="12" y2="10" /><line x1="18" y1="20" x2="18" y2="4" /><line x1="6" y1="20" x2="6" y2="16" /></IconWrapper>;
        const BrainCircuit = (props) => <IconWrapper {...props}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></IconWrapper>; // Using CPU icon for logic
        const Plus = (props) => <IconWrapper {...props}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></IconWrapper>;
        const Trash2 = (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></IconWrapper>;
        const Download = (props) => <IconWrapper {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></IconWrapper>;
        const Copy = (props) => <IconWrapper {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></IconWrapper>;
        const Save = (props) => <IconWrapper {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></IconWrapper>;


        const App = () => {
            // --- 初始状态 ---
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            
            const [marketData, setMarketData] = useState({
                shanghai_index: "",      // 上证指数涨跌幅
                market_volume: "",       // 全市场成交量
                market_sentiment: "平淡", // 市场情绪
                main_theme: ""           // 当日主线
            });

            const [accountData, setAccountData] = useState({
                daily_pnl: "",           // 当日盈亏金额
                pnl_percent: "",         // 当日盈亏百分比
                total_asset: "",         // 总资产
                transfer_amount: "",     // 银证转账
                self_rating: 3           // 自我评分 1-5
            });

            const [trades, setTrades] = useState([
                // 默认给一个空行
                {
                    id: 1,
                    stock_name: "",
                    stock_code: "",
                    action: "HOLD",      // BUY, SELL, HOLD, WATCH
                    price: "",
                    change_percent: "",  // 个股涨跌幅
                    logic: "",           // 核心逻辑
                    attribution: "NONE"  // 归因: 模式内盈利/亏损等
                }
            ]);

            // --- 辅助函数 ---
            const addTradeRow = () => {
                setTrades([...trades, {
                    id: Date.now(),
                    stock_name: "",
                    stock_code: "",
                    action: "BUY",
                    price: "",
                    change_percent: "",
                    logic: "",
                    attribution: "NONE"
                }]);
            };

            const removeTradeRow = (id) => {
                setTrades(trades.filter(t => t.id !== id));
            };

            const updateTrade = (id, field, value) => {
                setTrades(trades.map(t => t.id === id ? { ...t, [field]: value } : t));
            };

            // --- 生成 JSON ---
            const generateJSON = () => {
                return JSON.stringify({
                    meta: {
                        date: date,
                        version: "1.0"
                    },
                    market_environment: {
                        index_performance: marketData.shanghai_index,
                        total_volume: marketData.market_volume,
                        sentiment: marketData.market_sentiment,
                        main_theme: marketData.main_theme
                    },
                    account_summary: {
                        daily_pnl: parseFloat(accountData.daily_pnl) || 0,
                        daily_pnl_percent: parseFloat(accountData.pnl_percent) || 0,
                        total_asset: parseFloat(accountData.total_asset) || 0,
                        bank_transfer: parseFloat(accountData.transfer_amount) || 0, // 银证转账字段
                        discipline_score: parseInt(accountData.self_rating)
                    },
                    trade_details: trades.map(t => ({
                        stock: t.stock_name,
                        code: t.stock_code,
                        action: t.action,
                        avg_price: parseFloat(t.price) || 0,
                        stock_daily_change: parseFloat(t.change_percent) || 0,
                        rationale: t.logic,
                        result_attribution: t.attribution // 核心归因字段
                    }))
                }, null, 4);
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(generateJSON());
                alert("JSON 已复制到剪贴板！");
            };

            const downloadJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(generateJSON());
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `review_${date}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
                    <header className="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-2">
                                <Activity className="text-red-500" /> 
                                每日A股复盘系统
                            </h1>
                            <p className="text-slate-500 mt-1">知行合一 · 数据驱动 · 逻辑验证</p>
                        </div>
                        <div className="flex items-center gap-2 bg-white p-2 rounded-lg shadow-sm border border-slate-200">
                            <span className="text-slate-600 font-medium">日期:</span>
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)}
                                className="border-none focus:ring-0 text-slate-800 font-bold"
                            />
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* 左侧：输入区域 */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {/* 1. 市场环境 (简略) */}
                            <section className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
                                    <BarChart3 size={20} /> 市场环境
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">上证指数涨跌</label>
                                        <input type="text" placeholder="+0.5% / 放量长阳" 
                                            className="w-full p-2 border rounded bg-slate-50 focus:border-blue-500 outline-none"
                                            value={marketData.shanghai_index} onChange={e => setMarketData({...marketData, shanghai_index: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">两市成交额</label>
                                        <input type="text" placeholder="8000亿 / 缩量" 
                                            className="w-full p-2 border rounded bg-slate-50 focus:border-blue-500 outline-none"
                                            value={marketData.market_volume} onChange={e => setMarketData({...marketData, market_volume: e.target.value})}
                                        />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs text-slate-500 mb-1">核心主线/题材</label>
                                        <input type="text" placeholder="例如：低空经济、华为产业链、高股息..." 
                                            className="w-full p-2 border rounded bg-slate-50 focus:border-blue-500 outline-none"
                                            value={marketData.main_theme} onChange={e => setMarketData({...marketData, main_theme: e.target.value})}
                                        />
                                    </div>
                                </div>
                            </section>

                            {/* 2. 核心交易逻辑 (重点) */}
                            <section className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-slate-700 flex items-center gap-2">
                                        <BrainCircuit size={20} /> 个股操作与逻辑
                                    </h2>
                                    <button onClick={addTradeRow} className="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded-full hover:bg-blue-100 transition flex items-center gap-1">
                                        <Plus size={16} /> 添加
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {trades.map((trade, index) => (
                                        <div key={trade.id} className="p-4 border border-slate-200 rounded-lg bg-slate-50 relative group">
                                            <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition">
                                                <button onClick={() => removeTradeRow(trade.id)} className="text-red-400 hover:text-red-600"><Trash2 size={16}/></button>
                                            </div>
                                            
                                            {/* 第一行：代码/动作/价格 */}
                                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-3">
                                                <input type="text" placeholder="股票名称" 
                                                    className="p-2 border rounded text-sm font-bold text-slate-700"
                                                    value={trade.stock_name} onChange={e => updateTrade(trade.id, 'stock_name', e.target.value)}
                                                />
                                                <input type="text" placeholder="代码" 
                                                    className="p-2 border rounded text-sm font-mono text-slate-600"
                                                    value={trade.stock_code} onChange={e => updateTrade(trade.id, 'stock_code', e.target.value)}
                                                />
                                                <select 
                                                    className={`p-2 border rounded text-sm font-bold ${trade.action === 'BUY' ? 'text-red-600 bg-red-50' : trade.action === 'SELL' ? 'text-green-600 bg-green-50' : 'text-slate-600'}`}
                                                    value={trade.action} onChange={e => updateTrade(trade.id, 'action', e.target.value)}
                                                >
                                                    <option value="BUY">买入 (开仓)</option>
                                                    <option value="SELL">卖出 (止盈/损)</option>
                                                    <option value="HOLD">持仓不动</option>
                                                    <option value="WATCH">观察/卖飞</option>
                                                </select>
                                                <input type="number" placeholder="成交/当前价" 
                                                    className="p-2 border rounded text-sm"
                                                    value={trade.price} onChange={e => updateTrade(trade.id, 'price', e.target.value)}
                                                />
                                                <input type="number" placeholder="个股涨跌%" 
                                                    className={`p-2 border rounded text-sm ${parseFloat(trade.change_percent) > 0 ? 'text-red-500' : parseFloat(trade.change_percent) < 0 ? 'text-green-500' : ''}`}
                                                    value={trade.change_percent} onChange={e => updateTrade(trade.id, 'change_percent', e.target.value)}
                                                />
                                            </div>

                                            {/* 第二行：逻辑与归因 */}
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                <div className="md:col-span-2">
                                                    <textarea placeholder="核心逻辑：为何买？为何卖？(例如：打板、突破均线、止损)" 
                                                        rows={3}
                                                        className="w-full p-2 border rounded text-sm bg-white focus:border-indigo-500 outline-none resize-none"
                                                        value={trade.logic} onChange={e => updateTrade(trade.id, 'logic', e.target.value)}
                                                    />
                                                </div>
                                                <div>
                                                    <select 
                                                        className="w-full p-2 border rounded text-sm bg-white text-slate-700 h-full"
                                                        value={trade.attribution} onChange={e => updateTrade(trade.id, 'attribution', e.target.value)}
                                                    >
                                                        <option value="NONE">选择盈亏归因...</option>
                                                        <option value="MODE_WIN">✅ 模式内盈利 (实力)</option>
                                                        <option value="LUCK_WIN">🍀 模式外盈利 (运气)</option>
                                                        <option value="MODE_LOSS">🛡️ 模式内亏损 (成本)</option>
                                                        <option value="DISCIPLINE_LOSS">⚠️ 模式外亏损 (乱做)</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* 3. 账户概览 */}
                            <section className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-700 mb-4">账户总结</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 items-center">
                                    <div>
                                        <label className="block text-xs text-slate-500">当日盈亏 (元)</label>
                                        <input type="number" className="w-full p-2 border rounded font-mono" 
                                            value={accountData.daily_pnl} onChange={e => setAccountData({...accountData, daily_pnl: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-500">总资产</label>
                                        <input type="number" className="w-full p-2 border rounded font-mono" 
                                            value={accountData.total_asset} onChange={e => setAccountData({...accountData, total_asset: e.target.value})}
                                        />
                                    </div>
                                     <div>
                                        <label className="block text-xs text-slate-500">银证转账 (入+/出-)</label>
                                        <input type="number" className="w-full p-2 border rounded font-mono bg-blue-50" placeholder="0"
                                            value={accountData.transfer_amount} onChange={e => setAccountData({...accountData, transfer_amount: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-2">今日自我打分</label>
                                        <div className="flex gap-1 justify-between">
                                            {[1, 2, 3, 4, 5].map(star => (
                                                <button 
                                                    key={star}
                                                    onClick={() => setAccountData({...accountData, self_rating: star})}
                                                    className={`w-8 h-8 rounded-full font-bold transition text-sm flex items-center justify-center ${accountData.self_rating >= star ? 'bg-yellow-400 text-white' : 'bg-slate-100 text-slate-300'}`}
                                                >
                                                    {star}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* 右侧：JSON 预览区 */}
                        <div className="lg:col-span-1">
                            <div className="bg-slate-800 rounded-xl shadow-lg p-4 sticky top-6">
                                <div className="flex justify-between items-center mb-4 text-white">
                                    <h3 className="font-bold flex items-center gap-2"><Save size={16}/> JSON 数据预览</h3>
                                    <div className="flex gap-2">
                                        <button onClick={copyToClipboard} className="p-1.5 hover:bg-slate-700 rounded text-slate-400 hover:text-white" title="复制"><Copy size={16}/></button>
                                        <button onClick={downloadJson} className="p-1.5 hover:bg-slate-700 rounded text-slate-400 hover:text-white" title="下载文件"><Download size={16}/></button>
                                    </div>
                                </div>
                                <div className="h-[calc(100vh-200px)] overflow-y-auto custom-scrollbar">
                                    <pre className="json-pre">{generateJSON()}</pre>
                                </div>
                                <div className="mt-4 text-xs text-slate-500 text-center">
                                    该 JSON 格式可用于后续量化回测或数据导入
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
